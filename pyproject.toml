[project]
name = "agents-hub"
version = "0.1.0"
description = "Terminal hub for Claude Code sessions in iTerm2"
readme = "README.md"
authors = [
    { name = "liorderei-upwind" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
agents = "agents_hub.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
